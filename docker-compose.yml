services:
  db:
    image: postgres:16
    container_name: smart_cab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_cab_db
    ports:
      - "5441:5432"
    volumes:
      - smart_cab_pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: smart_cab_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever DATABASE_URL is in .env -- inside Docker's
      # internal network the backend reaches Postgres via the service
      # name "db" on its internal port 5432, regardless of which host
      # port we've mapped Postgres to (5441).
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smart_cab_db
    ports:
      - "8000:8000"
    volumes:
      # Mounts your local backend/app code into the container, so edits
      # on your machine are picked up live -- no rebuild needed for
      # code changes. Only requirements.txt changes still need --build.
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  smart_cab_pgdata: